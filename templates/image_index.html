<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Deepfake Detection</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
        color: white;
        padding: 30px;
        text-align: center;
      }

      .header h1 {
        font-size: 2.5em;
        margin-bottom: 10px;
      }

      .header p {
        font-size: 1.2em;
        opacity: 0.9;
      }

      .main-content {
        padding: 40px;
      }

      .upload-section {
        background: #f8f9fa;
        border-radius: 15px;
        padding: 30px;
        margin-bottom: 30px;
        text-align: center;
        border: 2px dashed #dee2e6;
        transition: all 0.3s ease;
      }

      .upload-section:hover {
        border-color: #667eea;
        background: #f0f2ff;
      }

      .upload-section.dragover {
        border-color: #667eea;
        background: #e8f0fe;
        transform: scale(1.02);
      }

      .upload-icon {
        font-size: 4em;
        color: #667eea;
        margin-bottom: 20px;
      }

      .file-input {
        display: none;
      }

      .upload-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 15px 30px;
        border: none;
        border-radius: 50px;
        font-size: 1.1em;
        cursor: pointer;
        transition: all 0.3s ease;
        margin: 10px;
      }

      .upload-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .batch-upload {
        margin-top: 20px;
      }

      .results-section {
        margin-top: 30px;
      }

      .result-card {
        background: white;
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 20px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        border-left: 5px solid #667eea;
      }

      .result-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      .result-filename {
        font-weight: bold;
        color: #2c3e50;
      }

      .result-prediction {
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: bold;
        text-transform: uppercase;
      }

      .prediction-real {
        background: #d4edda;
        color: #155724;
      }

      .prediction-fake {
        background: #f8d7da;
        color: #721c24;
      }

      .confidence-bar {
        background: #e9ecef;
        border-radius: 10px;
        height: 20px;
        margin: 10px 0;
        overflow: hidden;
      }

      .confidence-fill {
        height: 100%;
        border-radius: 10px;
        transition: width 0.5s ease;
      }

      .confidence-real {
        background: linear-gradient(90deg, #28a745, #20c997);
      }

      .confidence-fake {
        background: linear-gradient(90deg, #dc3545, #fd7e14);
      }

      .loading {
        text-align: center;
        padding: 40px;
      }

      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .error {
        background: #f8d7da;
        color: #721c24;
        padding: 15px;
        border-radius: 10px;
        margin: 10px 0;
      }

      .success {
        background: #d4edda;
        color: #155724;
        padding: 15px;
        border-radius: 10px;
        margin: 10px 0;
      }

      .batch-summary {
        background: #e3f2fd;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      .summary-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        margin-top: 15px;
      }

      .stat-item {
        text-align: center;
        padding: 15px;
        background: white;
        border-radius: 10px;
      }

      .stat-number {
        font-size: 2em;
        font-weight: bold;
        color: #667eea;
      }

      .stat-label {
        color: #666;
        margin-top: 5px;
      }

      .image-preview {
        max-width: 200px;
        max-height: 200px;
        border-radius: 10px;
        margin: 10px 0;
      }

      @media (max-width: 768px) {
        .container {
          margin: 10px;
          border-radius: 15px;
        }

        .header h1 {
          font-size: 2em;
        }

        .main-content {
          padding: 20px;
        }

        .result-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🔍 Image Deepfake Detection</h1>
        <p>Advanced AI-powered detection of manipulated images</p>
      </div>

      <div class="main-content">
        <!-- Single Image Upload -->
        <div class="upload-section" id="uploadSection">
          <div class="upload-icon">📸</div>
          <h3>Upload Image for Analysis</h3>
          <p>Drag and drop an image here or click to select</p>
          <input
            type="file"
            id="imageInput"
            class="file-input"
            accept="image/*"
          />
          <button
            class="upload-btn"
            onclick="document.getElementById('imageInput').click()"
          >
            Choose Image
          </button>

          <!-- Batch Upload -->
          <div class="batch-upload">
            <h4>Or upload multiple images:</h4>
            <input
              type="file"
              id="batchInput"
              class="file-input"
              accept="image/*"
              multiple
            />
            <button
              class="upload-btn"
              onclick="document.getElementById('batchInput').click()"
            >
              Choose Multiple Images
            </button>
          </div>
        </div>

        <!-- Results Section -->
        <div class="results-section" id="resultsSection" style="display: none">
          <h3>Analysis Results</h3>
          <div id="results"></div>
        </div>
      </div>
    </div>

    <script>
      const uploadSection = document.getElementById("uploadSection");
      const imageInput = document.getElementById("imageInput");
      const batchInput = document.getElementById("batchInput");
      const resultsSection = document.getElementById("resultsSection");
      const results = document.getElementById("results");

      // Drag and drop functionality
      uploadSection.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadSection.classList.add("dragover");
      });

      uploadSection.addEventListener("dragleave", () => {
        uploadSection.classList.remove("dragover");
      });

      uploadSection.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadSection.classList.remove("dragover");

        const files = e.dataTransfer.files;
        if (files.length === 1) {
          handleSingleImage(files[0]);
        } else if (files.length > 1) {
          handleBatchImages(files);
        }
      });

      // Single image upload
      imageInput.addEventListener("change", (e) => {
        if (e.target.files.length > 0) {
          handleSingleImage(e.target.files[0]);
        }
      });

      // Batch image upload
      batchInput.addEventListener("change", (e) => {
        if (e.target.files.length > 0) {
          handleBatchImages(e.target.files);
        }
      });

      function showLoading() {
        resultsSection.style.display = "block";
        results.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Analyzing image(s)... Please wait.</p>
                </div>
            `;
      }

      function showError(message) {
        results.innerHTML = `<div class="error">❌ Error: ${message}</div>`;
      }

      function handleSingleImage(file) {
        if (!file.type.startsWith("image/")) {
          showError("Please select a valid image file.");
          return;
        }

        showLoading();

        const formData = new FormData();
        formData.append("file", file);

        fetch("/api/predict", {
          method: "POST",
          body: formData,
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.error) {
              showError(data.error);
            } else {
              displaySingleResult(data, file);
            }
          })
          .catch((error) => {
            showError("Network error: " + error.message);
          });
      }

      function handleBatchImages(files) {
        const imageFiles = Array.from(files).filter((file) =>
          file.type.startsWith("image/"),
        );

        if (imageFiles.length === 0) {
          showError("Please select valid image files.");
          return;
        }

        showLoading();

        const formData = new FormData();
        imageFiles.forEach((file) => {
          formData.append("files", file);
        });

        fetch("/api/predict_batch", {
          method: "POST",
          body: formData,
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.error) {
              showError(data.error);
            } else {
              displayBatchResults(data, imageFiles);
            }
          })
          .catch((error) => {
            showError("Network error: " + error.message);
          });
      }

      function displaySingleResult(data, file) {
        const imageUrl = URL.createObjectURL(file);
        const predictionClass = data.is_fake
          ? "prediction-fake"
          : "prediction-real";
        const confidenceClass = data.is_fake
          ? "confidence-fake"
          : "confidence-real";

        results.innerHTML = `
                <div class="result-card">
                    <div class="result-header">
                        <span class="result-filename">${file.name}</span>
                        <span class="result-prediction ${predictionClass}">${data.prediction}</span>
                    </div>
                    <img src="${imageUrl}" alt="Uploaded image" class="image-preview">
                    <div class="confidence-bar">
                        <div class="confidence-fill ${confidenceClass}" style="width: ${data.confidence * 100}%"></div>
                    </div>
                    <p><strong>Confidence:</strong> ${(data.confidence * 100).toFixed(1)}%</p>
                    <p><strong>Raw Score:</strong> ${data.raw_score.toFixed(4)}</p>
                </div>
            `;
      }

      function displayBatchResults(data, files) {
        let html = "";

        // Summary
        if (data.summary) {
          html += `
                    <div class="batch-summary">
                        <h4>📊 Batch Analysis Summary</h4>
                        <div class="summary-stats">
                            <div class="stat-item">
                                <div class="stat-number">${data.summary.total_files}</div>
                                <div class="stat-label">Total Files</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">${data.summary.real_detected}</div>
                                <div class="stat-label">Real Images</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">${data.summary.fake_detected}</div>
                                <div class="stat-label">Fake Images</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">${data.summary.errors}</div>
                                <div class="stat-label">Errors</div>
                            </div>
                        </div>
                    </div>
                `;
        }

        // Individual results
        data.results.forEach((result, index) => {
          if (result.error) {
            html += `
                        <div class="result-card">
                            <div class="error">❌ ${result.filename}: ${result.error}</div>
                        </div>
                    `;
          } else {
            const file = files[result.index];
            const imageUrl = URL.createObjectURL(file);
            const predictionClass = result.is_fake
              ? "prediction-fake"
              : "prediction-real";
            const confidenceClass = result.is_fake
              ? "confidence-fake"
              : "confidence-real";

            html += `
                        <div class="result-card">
                            <div class="result-header">
                                <span class="result-filename">${result.filename}</span>
                                <span class="result-prediction ${predictionClass}">${result.prediction}</span>
                            </div>
                            <img src="${imageUrl}" alt="Uploaded image" class="image-preview">
                            <div class="confidence-bar">
                                <div class="confidence-fill ${confidenceClass}" style="width: ${result.confidence * 100}%"></div>
                            </div>
                            <p><strong>Confidence:</strong> ${(result.confidence * 100).toFixed(1)}%</p>
                            <p><strong>Raw Score:</strong> ${result.raw_score.toFixed(4)}</p>
                        </div>
                    `;
          }
        });

        results.innerHTML = html;
      }

      // Check API health on page load
      fetch("/api/health")
        .then((response) => response.json())
        .then((data) => {
          if (!data.model_loaded) {
            results.innerHTML = `
                        <div class="error">
                            ⚠️ Warning: No model is currently loaded. Please train a model first.
                        </div>
                    `;
            resultsSection.style.display = "block";
          }
        })
        .catch((error) => {
          console.log("Health check failed:", error);
        });
    </script>
  </body>
</html>
